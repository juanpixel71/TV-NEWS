<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Total Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* ==========================================
       1. ESTILOS GLOBALES Y RESET
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      border: none !important;
      outline: none !important;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #3C3C3B;
      color: #FFFFFF;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .header {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      padding-top: calc(20px + env(safe-area-inset-top, 20px));
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    /* ==========================================
       2. NAVEGACIÓN Y PANTALLAS
       ========================================== */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .screen.active {
      display: flex !important;
    }

    .view-content {
      flex: 1;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      overflow-y: auto;
      min-height: 0;
    }

    .btn-nav-back {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 10px;
      margin-top: 0;
      text-decoration: none;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .btn-nav-back:active {
      opacity: 0.8;
    }

    /* ==========================================
       3. PANTALLA DE TV Y REPRODUCTOR HLS (PORTRAIT)
       ========================================== */
    .tv-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      justify-content: space-between;
    }

    .tv-controls-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      justify-content: space-between;
      padding: 0 15px;
    }

    .tv-video-box {
      width: 100% !important;
      height: auto !important;
      aspect-ratio: 16 / 9 !important;
      background-color: #000000 !important;
      border-radius: 0 !important;
      flex-shrink: 0 !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      margin-bottom: 10px !important;
      position: relative !important;
    }

    #tv-video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      background-color: #000000 !important;
    }

    #screen-tv .grid-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .boton-canal {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #9D9D9C;
      color: #FFFFFF;
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      height: 100% !important;
      width: 100% !important;
    }

    .boton-canal.active-item { 
      background-color: #FF8C00 !important; 
    }

    #screen-tv .view-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      box-sizing: border-box;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    /* Restauración exacta de Portrait */
    #screen-tv .btn-nav-back {
      width: calc(100% - 30px) !important;
      margin: 0 15px !important;
      padding: 16px !important;
      font-size: 1.1rem !important;
      flex-shrink: 0;
    }

    /* ==========================================
       4. ESTILOS MODO LANDSCAPE (HORIZONTAL)
       ========================================== */
    @media screen and (orientation: landscape) {
      html, body, .app-container, .screen {
        background-color: #000000 !important;
      }

      .header {
        display: none !important;
      }

      #screen-tv .view-content {
        flex-direction: row !important;
        padding: 0 !important;
        gap: 0 !important;
        overflow: hidden !important;
        background-color: #000000 !important;
      }

      #screen-tv .tv-container {
        flex-direction: row !important;
        height: 100% !important;
        width: 100% !important;
        background-color: #000000 !important;
      }

      /* Reproductor maximizado a pantalla completa salvo notch */
      .tv-video-box {
        flex: 1 !important;
        height: 100% !important;
        width: 100% !important;
        aspect-ratio: unset !important;
        margin-bottom: 0 !important;
        background-color: #000000 !important;
        margin-left: max(25px, env(safe-area-inset-left, 25px)) !important;
      }

      #tv-video {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
        background-color: #000000 !important;
      }

      /* Columna de botones en Landscape */
      .tv-controls-box {
        width: 130px !important;
        max-width: 25vw !important;
        height: 100% !important;
        padding: 8px !important;
        padding-right: calc(8px + env(safe-area-inset-right, 0px)) !important;
        overflow-y: auto !important;
        justify-content: flex-start !important;
        background-color: #000000 !important;
        flex-shrink: 0 !important;
      }

      #screen-tv .grid-buttons {
        display: flex !important;
        flex-direction: column !important;
        gap: 6px !important;
        flex: none !important;
      }

      .boton-canal {
        height: 40px !important;
        min-height: 40px !important;
        font-size: 0.85rem !important;
        flex-shrink: 0 !important;
      }

      #screen-tv .btn-nav-back {
        width: 100% !important;
        margin: 8px 0 0 0 !important;
        height: 40px !important;
        padding: 0 !important;
        font-size: 0 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }

      #screen-tv .btn-nav-back::after {
        content: "< SALIR" !important;
        font-size: 0.85rem !important;
        font-weight: bold !important;
      }
    }
  </style>
</head>

1. **Si está en pantalla completa:** Cancela/sale de la pantalla completa y vuelve a la vista Landscape normal.

/* ==========================================
   CONTROL DEL BOTÓN "ATRÁS" DE ANDROID / GESTO
   ========================================== */
function salirDePantallaCompletaOSalirApp() {
  // 1. Si el vídeo está en modo pantalla completa nativo (HTML5 / Fullscreen API)
  if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement) {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else if (document.mozCancelFullScreen) {
      document.mozCancelFullScreen();
    }
    return; // Sale del modo pantalla completa y se queda en la app en LANDSCAPE
  }

  // 2. Si es un reproductor iOS / WebKit nativo en fullscreen
  if (videoElement && videoElement.webkitDisplayingFullscreen) {
    videoElement.webkitExitFullscreen();
    return;
  }

  // 3. Si no está en pantalla completa, procede a salir de la aplicación
  salirDeAplicacion();

function habilitarBotonAtrasAndroid() {
  // Manejo para Capacitor
  if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
    Capacitor.Plugins.App.addListener('backButton', () => {
      salirDePantallaCompletaOSalirApp();
    });
  }

  // Manejo para Cordova / Android Webview
  document.addEventListener('backbutton', (e) => {
    e.preventDefault();
    salirDePantallaCompletaOSalirApp();
  }, false);

  // Manejo para navegadores mediante el historial (gesto o botón del navegador)
  history.pushState(null, null, location.href);
  window.addEventListener('popstate', () => {
    salirDePantallaCompletaOSalirApp();
    history.pushState(null, null, location.href); // Mantiene la entrada para capturar siguientes clics
