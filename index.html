<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Total Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* ==========================================
       1. ESTILOS GLOBALES Y RESET
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      border: none !important;
      outline: none !important;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #3C3C3B;
      color: #FFFFFF;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .header {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      padding-top: calc(20px + env(safe-area-inset-top, 20px));
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    /* ==========================================
       2. NAVEGACIÓN Y PANTALLAS
       ========================================== */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .screen.active {
      display: flex !important;
    }

    .view-content {
      flex: 1;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      overflow-y: auto;
      min-height: 0;
    }

    .btn-nav-back {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 10px;
      margin-top: 0;
      text-decoration: none;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .btn-nav-back:active {
      opacity: 0.8;
    }

    /* ==========================================
       3. PANTALLA DE TV Y REPRODUCTOR HLS (PORTRAIT)
       ========================================== */
    .tv-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      justify-content: space-between;
    }

    .tv-controls-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      justify-content: space-between;
      padding: 0 15px;
    }

    .tv-video-box {
      width: 100% !important;
      height: auto !important;
      aspect-ratio: 16 / 9 !important;
      background-color: #000000 !important;
      border-radius: 0 !important;
      flex-shrink: 0 !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      margin-bottom: 10px !important;
      position: relative !important;
    }

    #tv-video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      background-color: #000000 !important;
    }

    #screen-tv .grid-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .boton-canal {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #9D9D9C;
      color: #FFFFFF;
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      height: 100% !important;
      width: 100% !important;
    }

    .boton-canal.active-item { 
      background-color: #FF8C00 !important; 
    }

    #screen-tv .view-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      box-sizing: border-box;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    #screen-tv .btn-nav-back {
      width: calc(100% - 30px) !important;
      margin: 0 15px;
      flex-shrink: 0;
    }

    /* ==========================================
       4. ESTILOS MODO LANDSCAPE (HORIZONTAL)
       ========================================== */
    @media screen and (orientation: landscape) {
      /* Fondo totalmente negro únicamente en landscape */
      html, body, .app-container, .screen {
        background-color: #000000 !important;
      }

      .header {
        display: none !important;
      }

      #screen-tv .view-content {
        flex-direction: row !important;
        padding: 0 !important;
        gap: 0 !important;
        overflow: hidden !important;
        background-color: #000000 !important;
      }

      #screen-tv .tv-container {
        flex-direction: row !important;
        height: 100% !important;
        width: 100% !important;
        background-color: #000000 !important;
      }

      .tv-video-box {
        flex: 1 !important;
        height: 100% !important;
        aspect-ratio: unset !important;
        margin-bottom: 0 !important;
        background-color: #000000 !important;
        /* Separación de la cámara / notch en el borde izquierdo */
        margin-left: max(25px, env(safe-area-inset-left, 25px)) !important;
      }

      #tv-video {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
        background-color: #000000 !important;
      }

      .tv-controls-box {
        width: 180px !important;
        max-width: 30vw !important;
        height: 100% !important;
        padding: 10px !important;
        padding-right: calc(10px + env(safe-area-inset-right, 0px)) !important;
        overflow-y: auto !important;
        justify-content: flex-start !important;
        background-color: #000000 !important;
      }

      #screen-tv .grid-buttons {
        display: flex !important;
        flex-direction: column !important;
        gap: 8px !important;
        flex: none !important;
      }

      .boton-canal {
        height: 45px !important;
        min-height: 45px !important;
        flex-shrink: 0 !important;
      }

      #screen-tv .btn-nav-back {
        width: 100% !important;
        margin: 10px 0 0 0 !important;
        height: 45px !important;
        padding: 0 !important;
        font-size: 0 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }

      #screen-tv .btn-nav-back::after {
        content: "< SALIR" !important;
        font-size: 1rem !important;
        font-weight: bold !important;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div id="screen-tv" class="screen active">
      <div class="header">TV-NEWS</div>
      <div class="view-content">
        <div class="tv-container">
          <div class="tv-video-box">
            <video id="tv-video" controls autoplay playsinline webkit-playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
          </div>

          <div class="tv-controls-box">
            <div class="grid-buttons" id="grid-buttons">
              <!-- Los botones se cargarán automáticamente desde el Gist -->
            </div>
            <button class="btn-nav-back" onclick="salirDeAplicacion()">&lt; SALIR DE LA APLICACIÓN</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    /* ==========================================
       VARIABLES GLOBALES Y ELEMENTOS DOM
       ========================================== */
    const videoElement = document.getElementById('tv-video');
    let hlsInstance = null;

    /* ==========================================
       CONTROL GENERAL Y NAVEGACIÓN
       ========================================== */
    function salirDeAplicacion() {
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
        Capacitor.Plugins.App.exitApp();
      } else if (navigator.app && navigator.app.exitApp) {
        navigator.app.exitApp();
      } else {
        window.close();
      }
    }

    function marcarBotonActivo(elemento) {
      if (!elemento) return;
      const contenedor = elemento.closest('.grid-buttons');
      if (contenedor) {
        contenedor.querySelectorAll('.boton-canal').forEach(b => b.classList.remove('active-item'));
      }
      elemento.classList.add('active-item');
    }

    /* ==========================================
       REPRODUCTOR TV (HLS)
       ========================================== */
    function loadChannel(url, btn) {
      marcarBotonActivo(btn);

      if (Hls.isSupported()) {
        if (hlsInstance) {
          hlsInstance.destroy();
        }
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoElement);
        
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          videoElement.play().catch(e => console.log("Error al reproducir HLS:", e));
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.details) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hlsInstance.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hlsInstance.recoverMediaError();
                break;
              default:
                hlsInstance.destroy();
                break;
            }
          }
        });
      } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
        videoElement.src = url;
        videoElement.addEventListener('loadedmetadata', () => {
          videoElement.play().catch(e => console.log("Error al reproducir nativo:", e));
        });
      }
    }

    /* ==========================================
       CARGA DINÁMICA DE CANALES DESDE GITHUB GIST
       ========================================== */
    const GIST_API_URL = 'https://api.github.com/gists/4dea433e849fcfda4869b1463f55e1f9';

    async function cargarCanalesDesdeGist() {
      const contenedorGrid = document.getElementById('grid-buttons');
      
      try {
        const respuesta = await fetch(GIST_API_URL);
        if (!respuesta.ok) throw new Error("No se pudo obtener el Gist");

        const datosGist = await respuesta.json();
        
        // Obtenemos el contenido del primer archivo dentro del Gist
        const nombreArchivo = Object.keys(datosGist.files)[0];
        const contenidoRaw = datosGist.files[nombreArchivo].content;
        
        // Parseamos el texto a JSON
        let canales = JSON.parse(contenidoRaw);

        // Si el JSON incluye la clave "tv", extraemos el array interior
        if (canales.tv) canales = canales.tv;

        // Limpiamos el contenedor
        contenedorGrid.innerHTML = '';

        // Generamos los botones sin encender ningún canal por defecto
        canales.forEach((canal) => {
          const nombreCanal = canal.nombre || canal.NOMBRE;
          const urlCanal = canal.url || canal.URL;

          const boton = document.createElement('button');
          boton.className = 'boton-canal';
          boton.textContent = nombreCanal;
          
          boton.onclick = function() {
            loadChannel(urlCanal, this);
          };

          contenedorGrid.appendChild(boton);
        });

      } catch (error) {
        console.error('Error al cargar canales:', error);
        contenedorGrid.innerHTML = '<p style="color: white; text-align: center; grid-column: span 2;">Error al cargar canales</p>';
      }
    }

    // Ejecutar la carga al cargar la interfaz
    document.addEventListener('DOMContentLoaded', cargarCanalesDesdeGist);
  </script>

</body>
</html>
