<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Total Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* ==========================================
       1. ESTILOS GLOBALES Y RESET (PORTRAIT ORIGINAL)
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      border: none !important;
      outline: none !important;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #3C3C3B;
      color: #FFFFFF;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .header {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      padding-top: calc(20px + env(safe-area-inset-top, 20px));
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    /* ==========================================
       2. NAVEGACIÓN Y PANTALLAS (PORTRAIT ORIGINAL)
       ========================================== */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .screen.active {
      display: flex !important;
    }

    .view-content {
      flex: 1;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      overflow-y: auto;
      min-height: 0;
    }

    .btn-nav-back {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 10px;
      margin-top: 0;
      text-decoration: none;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .btn-nav-back:active {
      opacity: 0.8;
    }

    /* ==========================================
       3. PANTALLA DE TV Y REPRODUCTOR (PORTRAIT ORIGINAL)
       ========================================== */
    .tv-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      justify-content: space-between;
    }

    .tv-controls-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      justify-content: space-between;
      padding: 0 15px;
    }

    .tv-video-box {
      width: 100% !important;
      height: auto !important;
      aspect-ratio: 16 / 9 !important;
      background-color: #000000 !important;
      border-radius: 0 !important;
      flex-shrink: 0 !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      margin-bottom: 10px !important;
      position: relative !important;
    }

    #tv-video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      background-color: #000000 !important;
    }

    #screen-tv .grid-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .boton-canal {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #9D9D9C;
      color: #FFFFFF;
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      height: 100% !important;
      width: 100% !important;
    }

    .boton-canal.active-item { 
      background-color: #FF8C00 !important; 
    }

    #screen-tv .view-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      box-sizing: border-box;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    #screen-tv .btn-nav-back {
      width: calc(100% - 30px) !important;
      margin: 0 15px;
      flex-shrink: 0;
    }

    /* Ocultar contenedor exclusivo de Landscape en modo Portrait */
    .landscape-layout {
      display: none !important;
    }

    /* ==========================================
       4. ESTRUCTURA INDEPENDIENTE PARA LANDSCAPE
       ========================================== */
    @media screen and (orientation: landscape) {
      /* Fondo negro absoluto */
      html, body, .app-container, .screen {
        background-color: #000000 !important;
      }

      /* Ocultar elementos de Portrait */
      .header, .portrait-layout {
        display: none !important;
      }

      /* Layout horizontal en Landscape */
      .landscape-layout {
        display: flex !important;
        flex-direction: row !important;
        width: 100vw !important;
        height: 100dvh !important;
        overflow: hidden !important;
        background-color: #000000 !important;
      }

      /* Contenedor del reproductor */
      .landscape-video-container {
        flex: 1 !important;
        height: 100% !important;
        background-color: #000000 !important;
        margin-left: max(25px, env(safe-area-inset-left, 25px)) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }

      /* Columna de scroll unificada */
      .landscape-sidebar {
        width: 130px !important;
        max-width: 25vw !important;
        height: 100% !important;
        background-color: #000000 !important;
        padding: 8px !important;
        padding-right: calc(8px + env(safe-area-inset-right, 0px)) !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 6px !important;
        overflow-y: auto !important;
        flex-shrink: 0 !important;
      }

      .landscape-sidebar .grid-buttons {
        display: flex !important;
        flex-direction: column !important;
        gap: 6px !important;
        width: 100% !important;
      }

      .landscape-sidebar .boton-canal {
        height: 40px !important;
        min-height: 40px !important;
        font-size: 0.85rem !important;
        border-radius: 8px !important;
        flex-shrink: 0 !important;
      }

      /* Botón < SALIR integrado al final en el mismo flujo */
      .landscape-sidebar .btn-nav-back {
        width: 100% !important;
        height: 40px !important;
        min-height: 40px !important;
        margin: 0 !important;
        padding: 0 !important;
        font-size: 0.85rem !important;
        border-radius: 8px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        background-color: #FF8C00 !important;
        color: #FFFFFF !important;
        font-weight: bold !important;
        flex-shrink: 0 !important;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div id="screen-tv" class="screen active">
      <div class="header">TV-NEWS</div>
      
      <!-- ================= ESTRUCTURA PORTRAIT (ORIGINAL) ================= -->
      <div class="view-content portrait-layout">
        <div class="tv-container">
          <div class="tv-video-box">
            <div id="video-wrapper-portrait" style="width:100%; height:100%;">
              <video id="tv-video" controls autoplay playsinline webkit-playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
            </div>
          </div>

          <div class="tv-controls-box">
            <div class="grid-buttons" id="grid-buttons-portrait">
              <!-- Carga de botones Portrait -->
            </div>
          </div>
        </div>
        <button class="btn-nav-back" onclick="salirDeAplicacion()">&lt; SALIR DE LA APLICACIÓN</button>
      </div>

      <!-- ================= ESTRUCTURA LANDSCAPE (INDEPENDIENTE) ================= -->
      <div class="landscape-layout">
        <div class="landscape-video-container" id="video-wrapper-landscape">
          <!-- El video se traslada aquí al rotar -->
        </div>
        <div class="landscape-sidebar">
          <div class="grid-buttons" id="grid-buttons-landscape">
            <!-- Carga de botones Landscape -->
          </div>
          <button class="btn-nav-back" onclick="salirDeAplicacion()">&lt; SALIR</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    /* ==========================================
       VARIABLES GLOBALES Y ELEMENTOS DOM
       ========================================== */
    const videoElement = document.getElementById('tv-video');
    const wrapperPortrait = document.getElementById('video-wrapper-portrait');
    const wrapperLandscape = document.getElementById('video-wrapper-landscape');
    let hlsInstance = null;

    /* ==========================================
       REUBICACIÓN AUTOMÁTICA DEL REPRODUCTOR
       ========================================== */
    function adaptarReproductorPorOrientacion() {
      const esLandscape = window.matchMedia("(orientation: landscape)").matches;
      if (esLandscape) {
        if (!wrapperLandscape.contains(videoElement)) {
          wrapperLandscape.appendChild(videoElement);
        }
      } else {
        if (!wrapperPortrait.contains(videoElement)) {
          wrapperPortrait.appendChild(videoElement);
        }
      }
    }

    window.addEventListener('resize', adaptarReproductorPorOrientacion);
    window.addEventListener('orientationchange', adaptarReproductorPorOrientacion);

    /* ==========================================
       CONTROL GENERAL Y SALIDA / BOTÓN ATRÁS ANDROID
       ========================================== */
    function salirDeAplicacion() {
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
        Capacitor.Plugins.App.exitApp();
      } else if (navigator.app && navigator.app.exitApp) {
        navigator.app.exitApp();
      } else {
        window.close();
      }
    }

    function salirDePantallaCompletaOSalirApp() {
      if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement) {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        }
        return;
      }

      if (videoElement && videoElement.webkitDisplayingFullscreen) {
        videoElement.webkitExitFullscreen();
        return;
      }

      salirDeAplicacion();
    }

    function habilitarBotonAtrasAndroid() {
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
        Capacitor.Plugins.App.addListener('backButton', () => {
          salirDePantallaCompletaOSalirApp();
        });
      }

      document.addEventListener('backbutton', (e) => {
        e.preventDefault();
        salirDePantallaCompletaOSalirApp();
      }, false);

      history.pushState(null, null, location.href);
      window.addEventListener('popstate', () => {
        salirDePantallaCompletaOSalirApp();
        history.pushState(null, null, location.href);
      });
    }

    function marcarBotonActivo(url) {
      document.querySelectorAll('.boton-canal').forEach(b => {
        if (b.dataset.url === url) {
          b.classList.add('active-item');
        } else {
          b.classList.remove('active-item');
        }
      });
    }

    /* ==========================================
       REPRODUCTOR TV (HLS)
       ========================================== */
    function loadChannel(url) {
      marcarBotonActivo(url);

      if (Hls.isSupported()) {
        if (hlsInstance) {
          hlsInstance.destroy();
        }
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoElement);
        
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          videoElement.play().catch(e => console.log("Error al reproducir HLS:", e));
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.details) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hlsInstance.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hlsInstance.recoverMediaError();
                break;
              default:
                hlsInstance.destroy();
                break;
            }
          }
        });
      } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
        videoElement.src = url;
        videoElement.addEventListener('loadedmetadata', () => {
          videoElement.play().catch(e => console.log("Error al reproducir nativo:", e));
        });
      }
    }

    /* ==========================================
       CARGA DINÁMICA DE CANALES DESDE GITHUB GIST
       ========================================== */
    const GIST_API_URL = 'https://api.github.com/gists/4dea433e849fcfda4869b1463f55e1f9';

    async function cargarCanalesDesdeGist() {
      const gridPortrait = document.getElementById('grid-buttons-portrait');
      const gridLandscape = document.getElementById('grid-buttons-landscape');
      
      try {
        const respuesta = await fetch(GIST_API_URL);
        if (!respuesta.ok) throw new Error("No se pudo obtener el Gist");

        const datosGist = await respuesta.json();
        const nombreArchivo = Object.keys(datosGist.files)[0];
        const contenidoRaw = datosGist.files[nombreArchivo].content;
        
        let canales = JSON.parse(contenidoRaw);
        if (canales.tv) canales = canales.tv;

        gridPortrait.innerHTML = '';
        gridLandscape.innerHTML = '';

        canales.forEach((canal) => {
          const nombreCanal = canal.nombre || canal.NOMBRE;
          const urlCanal = canal.url || canal.URL;

          // Botón Portrait
          const botonPortrait = document.createElement('button');
          botonPortrait.className = 'boton-canal';
          botonPortrait.textContent = nombreCanal;
          botonPortrait.dataset.url = urlCanal;
          botonPortrait.onclick = () => loadChannel(urlCanal);

          // Botón Landscape
          const botonLandscape = document.createElement('button');
          botonLandscape.className = 'boton-canal';
          botonLandscape.textContent = nombreCanal;
          botonLandscape.dataset.url = urlCanal;
          botonLandscape.onclick = () => loadChannel(urlCanal);

          gridPortrait.appendChild(botonPortrait);
          gridLandscape.appendChild(botonLandscape);
        });

      } catch (error) {
        console.error('Error al cargar canales:', error);
        gridPortrait.innerHTML = '<p style="color: white; text-align: center; grid-column: span 2;">Error al cargar canales</p>';
        gridLandscape.innerHTML = '<p style="color: white; text-align: center;">Error al cargar canales</p>';
      }
    }

    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
      adaptarReproductorPorOrientacion();
      cargarCanalesDesdeGist();
      habilitarBotonAtrasAndroid();
    });
  </script>

</body>
</html>
