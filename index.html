<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Total Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* ==========================================
       1. ESTILOS GLOBALES Y RESET
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      border: none !important;
      outline: none !important;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #3C3C3B;
      color: #FFFFFF;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }

    .screen.active {
      display: flex !important;
    }

    .btn-nav-back {
      background-color: #292929;
      color: #FFFFFF;
      padding: 14px;
      text-align: center;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      border-radius: 10px;
      text-decoration: none;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .btn-nav-back:active {
      opacity: 0.8;
    }

    /* ==========================================
       2. ESTRUCTURA AISLADA: PORTRAIT
       ========================================== */
    .portrait-layout {
      display: flex !important;
      flex-direction: column !important;
      width: 100% !important;
      height: 100dvh !important;
      background-color: #000000 !important;
      padding-top: env(safe-area-inset-top, 0px) !important;
      padding-bottom: max(10px, env(safe-area-inset-bottom, 10px)) !important;
      padding-left: 12px !important;
      padding-right: 12px !important;
      justify-content: space-between !important;
      overflow: hidden !important;
    }

    /* Reproductor ocupa la mitad superior de la pantalla (50dvh) */
    .portrait-video-box {
      width: 100% !important;
      height: 50dvh !important;
      max-height: 50dvh !important;
      background-color: #000000 !important;
      flex-shrink: 0 !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      position: relative !important;
    }

    #video-wrapper-portrait {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* Mantiene los recortes laterales ajustando la imagen al contenedor */
    #tv-video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      background-color: #000000 !important;
    }

    .portrait-controls-box {
      display: flex !important;
      flex-direction: column !important;
      flex: 1 !important;
      min-height: 0 !important;
      width: 100% !important;
      justify-content: center !important;
      margin: 8px 0 !important;
    }

    #grid-buttons-portrait {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      grid-template-rows: repeat(4, 1fr) !important;
      gap: 6px !important;
      flex: 1 !important;
      min-height: 0 !important;
      width: 100% !important;
    }

    .portrait-layout .boton-canal {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background-color: #9D9D9C !important;
      color: #FFFFFF !important;
      padding: 4px 2px !important;
      border-radius: 8px !important;
      font-size: 0.95rem !important;
      font-weight: bold !important;
      text-align: center !important;
      cursor: pointer !important;
      height: 100% !important;
      width: 100% !important;
    }

    .boton-canal.active-item { 
      background-color: #292929 !important; 
    }

    .portrait-layout .btn-nav-back {
      width: 100% !important;
      flex-shrink: 0 !important;
    }

    /* Ocultar Landscape en modo Portrait */
    .landscape-layout {
      display: none !important;
    }

    /* ==========================================
       3. ESTRUCTURA AISLADA: LANDSCAPE
       ========================================== */
    @media screen and (orientation: landscape) {
      html, body, .app-container, .screen {
        background-color: #000000 !important;
      }

      /* Ocultar por completo Portrait en Landscape */
      .portrait-layout {
        display: none !important;
      }

      /* Layout horizontal personalizado */
      .landscape-layout {
        display: flex !important;
        flex-direction: row !important;
        width: 100vw !important;
        height: 100dvh !important;
        overflow: hidden !important;
        background-color: #000000 !important;
      }

      .landscape-video-container {
        flex: 1 !important;
        height: 100% !important;
        background-color: #000000 !important;
        margin-left: max(25px, env(safe-area-inset-left, 25px)) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        overflow: hidden !important;
      }

      #video-wrapper-landscape {
        width: 100% !important;
        height: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }

      /* En landscape el video se ajusta dinámicamente sin desbordar */
      .landscape-layout #tv-video {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
      }

      .landscape-sidebar {
        width: 130px !important;
        max-width: 25vw !important;
        height: 100% !important;
        background-color: #000000 !important;
        padding: 8px !important;
        padding-right: calc(8px + env(safe-area-inset-right, 0px)) !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 6px !important;
        overflow-y: auto !important;
        flex-shrink: 0 !important;
      }

      .landscape-sidebar .grid-buttons {
        display: flex !important;
        flex-direction: column !important;
        gap: 6px !important;
        width: 100% !important;
      }

      .landscape-sidebar .boton-canal {
        height: 40px !important;
        min-height: 40px !important;
        font-size: 0.85rem !important;
        border-radius: 8px !important;
        flex-shrink: 0 !important;
        background-color: #9D9D9C !important;
        color: #FFFFFF !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        font-weight: bold !important;
        cursor: pointer !important;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <div id="screen-tv" class="screen active">
      
      <!-- ================= ESTRUCTURA PORTRAIT ================= -->
      <div class="portrait-layout">
        <div class="portrait-video-box">
          <div id="video-wrapper-portrait">
            <video id="tv-video" controls autoplay playsinline webkit-playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
          </div>
        </div>

        <div class="portrait-controls-box">
          <div class="grid-buttons" id="grid-buttons-portrait">
            <!-- Carga de botones Portrait -->
          </div>
        </div>

        <button class="btn-nav-back" onclick="salirDeAplicacion()">&lt; SALIR DE LA APLICACIÓN</button>
      </div>

      <!-- ================= ESTRUCTURA LANDSCAPE ================= -->
      <div class="landscape-layout">
        <div class="landscape-video-container">
          <div id="video-wrapper-landscape">
            <!-- El video se reubica aquí de forma dinámica -->
          </div>
        </div>
        <div class="landscape-sidebar">
          <div class="grid-buttons" id="grid-buttons-landscape">
            <!-- Carga de botones Landscape -->
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    /* ==========================================
       VARIABLES GLOBALES Y ELEMENTOS DOM
       ========================================== */
    const videoElement = document.getElementById('tv-video');
    const wrapperPortrait = document.getElementById('video-wrapper-portrait');
    const wrapperLandscape = document.getElementById('video-wrapper-landscape');
    let hlsInstance = null;

    /* ==========================================
       REUBICACIÓN AUTOMÁTICA DEL REPRODUCTOR
       ========================================== */
    function adaptarReproductorPorOrientacion() {
      const esLandscape = window.matchMedia("(orientation: landscape)").matches;
      if (esLandscape) {
        if (!wrapperLandscape.contains(videoElement)) {
          wrapperLandscape.appendChild(videoElement);
        }
      } else {
        if (!wrapperPortrait.contains(videoElement)) {
          wrapperPortrait.appendChild(videoElement);
        }
      }
    }

    window.addEventListener('resize', adaptarReproductorPorOrientacion);
    window.addEventListener('orientationchange', adaptarReproductorPorOrientacion);

    /* ==========================================
       CONTROL GENERAL Y SALIDA / BOTÓN ATRÁS ANDROID
       ========================================== */
    function salirDeAplicacion() {
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
        Capacitor.Plugins.App.exitApp();
      } else if (navigator.app && navigator.app.exitApp) {
        navigator.app.exitApp();
      } else {
        window.close();
      }
    }

    function salirDePantallaCompletaOSalirApp() {
      if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement) {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        }
        return;
      }

      if (videoElement && videoElement.webkitDisplayingFullscreen) {
        videoElement.webkitExitFullscreen();
        return;
      }

      salirDeAplicacion();
    }

    function habilitarBotonAtrasAndroid() {
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
        Capacitor.Plugins.App.addListener('backButton', () => {
          salirDePantallaCompletaOSalirApp();
        });
      }

      document.addEventListener('backbutton', (e) => {
        e.preventDefault();
        salirDePantallaCompletaOSalirApp();
      }, false);

      history.pushState(null, null, location.href);
      window.addEventListener('popstate', () => {
        salirDePantallaCompletaOSalirApp();
        history.pushState(null, null, location.href);
      });
    }

    function marcarBotonActivo(url) {
      document.querySelectorAll('.boton-canal').forEach(b => {
        if (b.dataset.url === url) {
          b.classList.add('active-item');
        } else {
          b.classList.remove('active-item');
