<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Total Player</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* ==========================================
       1. ESTILOS GLOBALES Y RESET
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      border: none !important;
      outline: none !important;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #3C3C3B;
      color: #FFFFFF;
      overflow: hidden;
    }

    /* Bloqueo de orientación Landscape en pantalla normal */
    @media screen and (orientation: landscape) {
      body:not(:has(:fullscreen)):not(:has(:webkit-fullscreen)) {
        max-width: 100vh;
        margin: 0 auto;
      }
    }

    .app-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .header {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      padding-top: calc(20px + env(safe-area-inset-top, 20px));
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    /* ==========================================
       2. NAVEGACIÓN Y PANTALLAS
       ========================================== */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #3C3C3B;
    }

    .screen.active {
      display: flex !important;
    }

    .view-content {
      flex: 1;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      overflow-y: auto;
      min-height: 0;
    }

    .btn-nav-back {
      background-color: #FF8C00;
      color: #FFFFFF;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 10px;
      margin-top: 0;
      text-decoration: none;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .btn-nav-back:active {
      opacity: 0.8;
    }

    /* ==========================================
       3. PANTALLA DE TV Y REPRODUCTOR HLS
       ========================================== */
    .tv-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      justify-content: space-between;
    }

    .tv-controls-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
      justify-content: space-between;
      padding: 0 15px; /* <--- AÑADIDO: 15px de margen a los lados */
    }

    .tv-video-box {
      width: 100% !important;
      height: auto !important;
      aspect-ratio: 16 / 9 !important;
      background-color: #000000 !important;
      border-radius: 0 !important;
      flex-shrink: 0 !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      margin-bottom: 10px !important;
      position: relative !important;
    }

    #tv-video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      background-color: #000000 !important;
    }

    /* Estilos para los 3 botones debajo del reproductor */
    .player-controls-row {
      display: flex;
      gap: 8px;
      margin-bottom: 0;
      width: 100%;
      flex-shrink: 0;
      padding: 0 15px; /* <--- AÑADIDO: 15px de margen a los lados */
    }

    .btn-player-action {
      flex: 1;
      background-color: #9D9D9C;
      color: #FFFFFF;
      padding: 10px 4px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-player-action:active,
    .btn-player-action.active-item {
      background-color: #FF8C00 !important;
    }

    #screen-tv .grid-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .boton-canal {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #9D9D9C;
      color: #FFFFFF;
      padding: 6px 4px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      height: 100% !important;
      width: 100% !important;
    }

    .boton-canal.active-item { 
      background-color: #FF8C00 !important; 
    }

    #screen-tv .view-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0; /* <--- CAMBIADO: 12px arriba/abajo y 0 a los lados */
      box-sizing: border-box;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

#screen-tv .btn-nav-back {
  width: calc(100% - 30px) !important; /* <--- AJUSTADO: resta los 15px de cada lado */
  margin: 0 15px; /* <--- AÑADIDO: margen lateral */
  flex-shrink: 0;
}
  </style>
</head>
<body>

  <div class="app-container">

    <div id="screen-tv" class="screen active">
      <div class="header">TV-NEWS</div>
      <div class="view-content">
        <div class="tv-container">
          <div class="tv-video-box">
            <video id="tv-video" controls autoplay playsinline webkit-playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
          </div>
          <div class="player-controls-row">
          <button id="btn-ampliar" class="btn-player-action" onclick="ampliarPantalla(this)">
              <span class="icon">⛶</span> AMPLIAR
            </button>
            <button id="btn-pause" class="btn-player-action" onclick="pauseVideo(this)">
              <span class="icon">⏸</span> PAUSE
            </button>
            <button id="btn-live" class="btn-player-action active-item" onclick="liveVideo(this)">LIVE</button>
          </div>

<!-- LÍNEA BLANCA DE SEPARACIÓN -->
<div style="padding: 0 15px; width: 100%;">
  <hr style="width: 100%; border: none; height: 1px; background-color: #FFFFFF; margin: 10px 0;">
</div>

     <div class="tv-controls-box">
  <div class="grid-buttons" id="grid-buttons">
    <!-- Los botones se cargarán automáticamente desde el Gist -->
  </div>
</div>
        </div>
        <button class="btn-nav-back" onclick="salirDeAplicacion()">&lt; SALIR DE LA APLICACIÓN</button>
      </div>
    </div>

  </div>

  <script>
    /* ==========================================
       VARIABLES GLOBALES Y ELEMENTOS DOM
       ========================================== */
    const videoElement = document.getElementById('tv-video');
    let hlsInstance = null;

    // Bloquear rotación en dispositivos que lo soporten
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('portrait').catch(() => {});
    }

    /* ==========================================
       CONTROL GENERAL Y NAVEGACIÓN
       ========================================== */
    function salirDeAplicacion() {
      if (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.App) {
        Capacitor.Plugins.App.exitApp();
      } else if (navigator.app && navigator.app.exitApp) {
        navigator.app.exitApp();
      } else {
        window.close();
      }
    }

    function marcarBotonActivo(elemento) {
      if (!elemento) return;
      const contenedor = elemento.closest('.grid-buttons');
      if (contenedor) {
        contenedor.querySelectorAll('.boton-canal').forEach(b => b.classList.remove('active-item'));
      }
      elemento.classList.add('active-item');
    }

    function marcarAccionActiva(elemento) {
      if (!elemento) return;
      const contenedor = elemento.closest('.player-controls-row');
      if (contenedor) {
        contenedor.querySelectorAll('.btn-player-action').forEach(b => b.classList.remove('active-item'));
      }
      elemento.classList.add('active-item');
    }

    /* ==========================================
       ACCIONES DE NAVEGACIÓN Y REPRODUCTOR
       ========================================== */
    function ampliarPantalla(btn) {
      marcarAccionActiva(btn);
      if (videoElement.requestFullscreen) {
        videoElement.requestFullscreen();
      } else if (videoElement.webkitRequestFullscreen) {
        videoElement.webkitRequestFullscreen();
      } else if (videoElement.msRequestFullscreen) {
        videoElement.msRequestFullscreen();
      } else if (videoElement.webkitEnterFullscreen) {
        videoElement.webkitEnterFullscreen();
      }
    }

    function pauseVideo(btn) {
      marcarAccionActiva(btn);
      if (videoElement) {
        videoElement.pause();
      }
    }

    function liveVideo(btn) {
      marcarAccionActiva(btn);
      if (videoElement) {
        if (videoElement.duration && !isNaN(videoElement.duration)) {
          videoElement.currentTime = videoElement.duration;
        }
        videoElement.play().catch(e => console.log("Error al reproducir en vivo:", e));
      }
    }

    /* ==========================================
       REPRODUCTOR TV (HLS)
       ========================================== */
    function loadChannel(url, btn) {
      marcarBotonActivo(btn);

      const btnLive = document.getElementById('btn-live');
      if (btnLive) marcarAccionActiva(btnLive);

      if (Hls.isSupported()) {
        if (hlsInstance) {
          hlsInstance.destroy();
        }
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoElement);
        
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          videoElement.play().catch(e => console.log("Error al reproducir HLS:", e));
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.details) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hlsInstance.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hlsInstance.recoverMediaError();
                break;
              default:
                hlsInstance.destroy();
                break;
            }
          }
        });
      } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
        videoElement.src = url;
        videoElement.addEventListener('loadedmetadata', () => {
          videoElement.play().catch(e => console.log("Error al reproducir nativo:", e));
        });
      }
    }

// URL de la API oficial de GitHub para tu Gist
const GIST_API_URL = 'https://api.github.com/gists/4dea433e849fcfda4869b1463f55e1f9';

async function cargarCanalesDesdeGist() {
  const contenedorGrid = document.getElementById('grid-buttons');
  
  try {
    const respuesta = await fetch(GIST_API_URL);
    if (!respuesta.ok) throw new Error("No se pudo obtener el Gist");

    const datosGist = await respuesta.json();
    
    // Obtenemos el contenido del archivo dentro del Gist
    const nombreArchivo = Object.keys(datosGist.files)[0];
    const contenidoRaw = datosGist.files[nombreArchivo].content;
    
    // Parseamos el texto a JSON
    let canales = JSON.parse(contenidoRaw);

    // Si el JSON incluye la clave "tv", extraemos el array interior
    if (canales.tv) canales = canales.tv;

    // Limpiamos el contenedor
    contenedorGrid.innerHTML = '';

    // Generamos los botones sin activar ninguno por defecto
    canales.forEach((canal) => {
      const nombreCanal = canal.nombre || canal.NOMBRE;
      const urlCanal = canal.url || canal.URL;

      const boton = document.createElement('button');
      boton.className = 'boton-canal';
      boton.textContent = nombreCanal;
      
      boton.onclick = function() {
        loadChannel(urlCanal, this);
      };

      contenedorGrid.appendChild(boton);
    });

  } catch (error) {
    console.error('Error al cargar canales:', error);
    contenedorGrid.innerHTML = '<p style="color: white; text-align: center; grid-column: span 2;">Error al cargar canales</p>';
  }
}

document.addEventListener('DOMContentLoaded', cargarCanalesDesdeGist);

    
  </script>
</body>
</html>
