<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TV-NEWS</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- REPRODUCTOR PRINCIPAL -->
  <div id="player-container">
    <video id="video" controls autoplay playsinline></video>
    <iframe id="youtube-player" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen style="display:none;"></iframe>
  </div>

  <!-- BARRA INFERIOR DE BOTONES (TV Y NOTICIAS) -->
  <div id="controls">
    <button class="btn" onclick="openModal('modal-tv')">📺 TV</button>
    <button class="btn" onclick="openModal('modal-news')">📰 NOTICIAS</button>
  </div>

  <!-- MODAL DE CANALES DE TV -->
  <div id="modal-tv" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('modal-tv')">&times;</span>
      <h2>Canales de TV</h2>
      <div id="list-tv" class="grid-container">
        <!-- Los canales de TV se cargan dinámicamente desde app.js -->
      </div>
    </div>
  </div>

  <!-- MODAL DE NOTICIAS -->
  <div id="modal-news" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('modal-news')">&times;</span>
      <h2>Noticias</h2>
      <div id="list-news" class="grid-container">
        <!-- Las fuentes de noticias se cargan dinámicamente desde app.js -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
